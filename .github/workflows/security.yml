name: Security Scan

on:
  push:
    branches: [ "main", "docker-infrastructure" ]
  pull_request:
    branches: [ "main", "docker-infrastructure" ]

jobs:
  python-security:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Bandit
      run: pip install bandit

    - name: Run Bandit Scan
      run: python -m bandit -r backend/ -x backend/tests/ -ll
      # -ll means show medium and high severity findings

  vulnerability-scan:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/python-3.12@master
      continue-on-error: true # Don't block the build if Snyk finds issues, just report
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --file=backend/requirements.txt

    - name: Install pip-audit
      run: pip install pip-audit

    - name: Run pip-audit Scan
      run: python -m pip_audit -r backend/requirements.txt

    - name: Docker Image Scan (Trivy for Windows)
      run: |
        Invoke-WebRequest -Uri "https://github.com/aquasecurity/trivy/releases/download/v0.49.1/trivy_0.49.1_windows-64bit.zip" -OutFile "trivy.zip"
        Expand-Archive trivy.zip -DestinationPath trivy-bin -Force
        ./trivy-bin/trivy.exe image --exit-code 0 --severity CRITICAL,HIGH --ignore-unfixed python:3.12-slim
