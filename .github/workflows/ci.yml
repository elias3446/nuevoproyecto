name: CI Pipeline

on:
  push:
    branches: [ "main", "docker-infrastructure" ]
  pull_request:
    branches: [ "main", "docker-infrastructure" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Create .env file for tests
      run: |
        cp .env.example .env
        sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=postgres/g' .env

    - name: Build and run Docker containers
      run: docker compose up -d --build

    - name: Wait for services to be healthy
      run: |
        # Poll for health status
        for i in {1..30}; do
          if [ "$(docker inspect -f '{{.State.Health.Status}}' myapp_db)" == "healthy" ]; then
            echo "Database is healthy!"
            break
          fi
          echo "Waiting for DB..."
          sleep 2
        done

    - name: Run Backend Tests with Coverage
      run: |
        docker compose exec -T backend pip install coverage
        docker compose exec -T backend coverage run manage.py test tests --noinput
        docker compose exec -T backend coverage report
        docker compose exec -T backend coverage xml -o coverage.xml
        # Copy the xml file from container to host so SonarCloud can see it
        docker cp myapp_backend:/app/coverage.xml .

    - name: SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@v5.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: Shutdown Docker
      if: always()
      run: docker compose down
