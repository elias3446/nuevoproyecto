name: ci_myapp
services:

  db:
    image: postgres:17
    container_name: ci_myapp_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_ci:/var/lib/postgresql/data
      - ./backend/db:/docker-entrypoint-initdb.d
    command: postgres -p ${DB_PORT} -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10
    healthcheck:
      test: ["CMD", "pg_isready", "-p", "${DB_PORT}", "-U", "${DB_USER}", "-d", "${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    container_name: ci_myapp_redis
    restart: unless-stopped
    command: redis-server --port ${REDIS_PORT}
    volumes:
      - redis_data_ci:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ci_myapp_nginx
    restart: unless-stopped
    volumes:
      - frontend_assets_ci:/usr/share/nginx/html:ro
      - static_volume_ci:/app/staticfiles:ro
      - media_volume_ci:/app/media:ro
    env_file:
      - .env
    depends_on:
      - backend
      - frontend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: ci_myapp_frontend
    volumes:
      - frontend_assets_ci:/app/dist_shared
    command: sh -c "rm -rf /app/dist_shared/* && cp -r /app/dist/* /app/dist_shared/ && echo 'Assets synchronized' && sleep infinity"

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: ci_myapp_frontend_dev
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      VITE_API_PROXY_TARGET: http://backend:${APP_PORT}
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port ${FRONTEND_PORT}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION:   ${PYTHON_VERSION}
        APP_DIR:          ${APP_DIR}
        APP_HOST:         ${APP_HOST}
        APP_PORT:         ${APP_PORT}
        GUNICORN_WORKERS: ${GUNICORN_WORKERS}
        DJANGO_WSGI:      ${DJANGO_WSGI}
    container_name: ci_myapp_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - static_volume_ci:/app/staticfiles
      - media_volume_ci:/app/media
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate --database=default --fake &&
             python manage.py migrate --database=celery_db --fake &&
             python manage.py migrate --database=jwt_db --fake &&
             python manage.py migrate --database=auth_db --fake &&
             if [ \"$DEBUG\" = \"True\" ]; then
               echo 'Starting Development Server (runserver)...' &&
               python manage.py runserver 0.0.0.0:${APP_PORT};
             else
               echo 'Starting Production Server (gunicorn)...' &&
               gunicorn ${DJANGO_WSGI} --bind 0.0.0.0:${APP_PORT} --workers ${GUNICORN_WORKERS};
             fi"

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION:   ${PYTHON_VERSION}
        APP_DIR:          ${APP_DIR}
        APP_HOST:         ${APP_HOST}
        APP_PORT:         ${APP_PORT}
        GUNICORN_WORKERS: ${GUNICORN_WORKERS}
        DJANGO_WSGI:      ${DJANGO_WSGI}
    container_name: ci_myapp_celery_worker
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - static_volume_ci:/app/staticfiles
      - media_volume_ci:/app/media
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker --loglevel=info

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION:   ${PYTHON_VERSION}
        APP_DIR:          ${APP_DIR}
        APP_HOST:         ${APP_HOST}
        APP_PORT:         ${APP_PORT}
        GUNICORN_WORKERS: ${GUNICORN_WORKERS}
        DJANGO_WSGI:      ${DJANGO_WSGI}
    container_name: ci_myapp_celery_beat
    restart: unless-stopped
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

volumes:
  postgres_data_ci:
  redis_data_ci:
  static_volume_ci:
  media_volume_ci:
  frontend_assets_ci:

networks:
  default:
    name: ci_myapp_network
